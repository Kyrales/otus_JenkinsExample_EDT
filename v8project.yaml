# yaml-language-server: $schema=https://raw.githubusercontent.com/alkoleft/v8-runner-rust/master/docs/schemas/v8project.schema.json
# Generated by v8-runner config init
workPath: 'build'
# Maximum execution time for a v8-runner command, in milliseconds.
execution_timeout: 3600000
format: EDT
builder: DESIGNER
infobase:
  connection: 'File=build/ib'
  user: 'Администратор'
tests:
  execution_timeout_seconds: 3600
  yaxunit:
    timeouts:
      startup_ms: 300000
      run_ms: 3600000
      total_ms: 3600000
  va:
    params_path: 'tools\VAParams.json'
    profile: 'all'
    timeouts:
      total_ms: 3600000
    profiles:
      all:
        feature_path: 'features'
        ignore_tags:
          - 'IgnoreOnCIMainBuild'
source-set:
  - name: 'otusJenkinsExampleEDT'
    type: CONFIGURATION
    path: 'src/cf/otusJenkinsExampleEDT'
  - name: 'YAXUNIT'
    type: EXTENSION
    path: 'src/cfe/otusJenkinsExampleEDT.YAXUNIT'
  - name: 'Колонтитулы'
    type: EXTENSION
    path: 'src/cfe/otusJenkinsExampleEDT.Колонтитулы'
tools:
  platform:
    version: '8.5.1'
build:
  partialLoadThreshold: 20
